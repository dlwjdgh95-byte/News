name: Daily News Briefing

# 결정론적 백업 경로. 통합 루틴(Miner/invest-wiki/ROUTINE_PROMPT.md)이 누락된 날에도
# briefs/<date>.{md,json}이 남도록 보장한다. 발송은 하지 않는다 — 2026-08-15부터
# 브리핑의 전달 경로는 텔레그램이 아니라 Miner의 리포트 페이지다.
#
# 매일 한국시간 06:00 = 전날 21:00 UTC. 루틴은 UTC 기준이므로 cron은 "0 21 * * *".
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:        # 수동 "Run Now" 검증용
    inputs:
      mode:
        description: "run mode"
        type: choice
        default: "archive"
        options: ["archive", "dry-run", "fallback"]

# state/, briefs/ 를 커밋하기 위한 쓰기 권한.
permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: true   # never let two runs race to push state

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (fresh clone each run; state lives in repo)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          case "$MODE" in
            dry-run)  python run.py --dry-run ;;
            fallback) python run.py --fallback ;;
            *)        python run.py ;;
          esac

      # briefs/<date>.json is the report-page IR. This backup path does NOT push
      # it to Miner — on a day when only this workflow runs, the report page's
      # news tab is empty by design (see docs/superpowers/specs in Miner).
      - name: Commit archive + sent-log
        if: ${{ github.event.inputs.mode != 'dry-run' }}
        run: |
          git config user.name "news-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ briefs/ || true
          if git diff --cached --quiet; then
            echo "No state/briefs changes to commit."
            exit 0
          fi
          git commit -m "chore: daily briefing $(date -u +%Y-%m-%d)"
          # Rebase onto the latest remote tip of THIS branch (not a hardcoded
          # main) and retry the push with backoff to survive transient races.
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              echo "Pushed state on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((2 ** attempt))
          done
          echo "::warning::Failed to push briefing state after retries."
